name: Run Delta Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python runtime deps
        run: pip install gTTS python-bidi requests pillow

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate syntax
        run: python -m compileall -q .

  run-agent:
    name: Run agent
    runs-on: ubuntu-latest
    needs: quality
    env:
      DELTA_SMTP_USER: ${{ secrets.DELTA_SMTP_USER }}
      DELTA_SMTP_PASSWORD: ${{ secrets.DELTA_SMTP_PASSWORD }}
      DELTA_ALERT_TO: ${{ secrets.DELTA_ALERT_TO }}
      DELTA_SMTP_HOST: ${{ secrets.DELTA_SMTP_HOST }}
      DELTA_SMTP_PORT: ${{ secrets.DELTA_SMTP_PORT }}
      DELTA_SCAN_INTERVAL_SECONDS: "3600"
      PYTHONUTF8: "1"
      LANG: he_IL.UTF-8
      LC_ALL: he_IL.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hebrew typography fonts and locale
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-extra fonts-liberation locales
          sudo locale-gen he_IL.UTF-8

      - name: Install Python dependencies
        run: pip install gTTS python-bidi requests pillow
      - name: Render marketing video
        run: python delta_agent.py
