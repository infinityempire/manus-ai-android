name: Deploy Delta Agent
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify delta_agent.py exists
        run: |
          echo "✅ delta_agent.py found:"
          head -5 delta_agent.py
          echo "✅ Deploy check passed"
