name: Deploy Delta Agent
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --detach --app delta-agent -e GMAIL_PASS=${{ secrets.GMAIL_PASS }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
