name: Build & Release Android APK (Container SDK)
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK via script
        run: |
          chmod +x create_install_file.sh
          ./create_install_file.sh debug
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manus-free-installer-apk
          path: dist/manus-free-installer.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/manus-free-installer.apk
          tag_name: v1.0-latest
          name: Manus AI APK (Latest)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
